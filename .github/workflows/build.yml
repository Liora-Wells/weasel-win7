name: 手动构建 Weasel（小狼毫）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Weasel 版本号'
        required: false
        default: '0.14.3'
      build_number:
        description: '构建号'
        required: false
        default: '0'
      librime_version:
        description: 'librime 版本号'
        required: false
        default: '1.11.2'
      build_installer:
        description: '生成安装包'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2022
    name: 构建 Weasel 输入法

    env:
      WEASEL_VERSION: ${{ github.event.inputs.version }}
      WEASEL_BUILD: ${{ github.event.inputs.build_number }}
      WEASEL_ROOT: ${{ github.workspace }}
      BOOST_ROOT: C:\Libraries\boost_1_74_0
      BOOST_VERSION: 1.74.0
      PLATFORM_TOOLSET: v141
      PYTHON_HOME: C:\py_dummy
      LIBRIME_VERSION: ${{ github.event.inputs.librime_version }}

    steps:
      # ==================== 1. Checkout ====================
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ==================== 2. Select Build Toolset ====================
      # VS 2022 (v143) dropped Win7 targeting. We need v141 (VS 2017) or v142
      # (VS 2019). windows-2022 image typically has v142 pre-installed.
      - name: Select Win7-compatible toolset
        id: toolset
        shell: powershell
        run: |
          $vs2022vc = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC"
          $vcvars = "$vs2022vc\Auxiliary\Build\vcvarsall.bat"
          $toolsDir = "$vs2022vc\Tools\MSVC"

          # List available MSVC versions for debugging
          Write-Host "Available MSVC toolset versions:"
          Get-ChildItem $toolsDir -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.Name)"
          }

          # Check for v141 (MSVC 14.16.x)
          $v141dir = Get-ChildItem "$toolsDir\14.16*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($v141dir) {
            Write-Host "v141 (14.16) found, using PLATFORM_TOOLSET=v141"
            "PLATFORM_TOOLSET=v141" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "BJAM_TOOLSET=msvc-14.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VCVARS_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          # Check for v142 (MSVC 14.2x)
          $v142dir = Get-ChildItem "$toolsDir\14.2*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($v142dir) {
            Write-Host "v142 ($($v142dir.Name)) found, using PLATFORM_TOOLSET=v142"
            Write-Host "v142 can target Win7 with _WIN32_WINNT=0x0601"
            "PLATFORM_TOOLSET=v142" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "BJAM_TOOLSET=msvc-14.2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VCVARS_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VCVARS_VER=$($v142dir.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          # Neither found - try to install v142 (VS 2022 native component)
          Write-Host "No Win7-compatible toolset found. Installing v142..."
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "VS Installer not found. Build aborted."
            exit 1
          }

          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          & $installer modify --installPath $vsPath `
            --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 `
            --passive --wait --norestart

          if ($LASTEXITCODE -ne 0) {
            Write-Error "v142 toolset install failed (exit code: $LASTEXITCODE)."
            exit 1
          }

          # Re-check after install
          $v142dir = Get-ChildItem "$toolsDir\14.2*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($v142dir) {
            Write-Host "v142 installed successfully."
            "PLATFORM_TOOLSET=v142" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "BJAM_TOOLSET=msvc-14.2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VCVARS_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Error "v142 not found after install."
            exit 1
          }

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "NSIS install failed, installer packaging will be skipped."
          }

      # ==================== 3. Cache and Build Boost ====================
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}\stage
            ${{ env.BOOST_ROOT }}\stage_x64
          key: boost-${{ env.BOOST_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download Boost source
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $boostVer = $env:BOOST_VERSION -replace '\.', '_'
          $boostZip = "$env:TEMP\boost_$boostVer.7z"

          # SourceForge direct download (follows redirects properly with curl)
          $boostUrl = "https://downloads.sourceforge.net/project/boost/boost/$env:BOOST_VERSION/boost_$boostVer.7z"

          Write-Host "Downloading Boost $env:BOOST_VERSION from SourceForge..."
          curl.exe -L -o $boostZip $boostUrl --retry 3 --connect-timeout 30

          # Verify the downloaded file is a valid 7z archive
          $fileSize = (Get-Item $boostZip).Length
          $sizeStr = "{0:N0}" -f $fileSize
          Write-Host "Downloaded: $sizeStr bytes"
          if ($fileSize -lt 100000) {
            Write-Error "Downloaded file is too small ($fileSize bytes), likely a redirect page."
            Get-Content $boostZip -First 5
            exit 1
          }

          Write-Host "Extracting Boost to $env:BOOST_ROOT ..."
          New-Item -ItemType Directory -Path $env:BOOST_ROOT -Force | Out-Null
          & 7z x $boostZip -o"C:\Libraries" -y | Select-Object -Last 5

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{ env.BOOST_ROOT }}
        run: |
          rem Use default VS 2022 toolset for bootstrap (only builds b2.exe)
          call "%VCVARS_PATH%" x86
          if not exist b2.exe call bootstrap.bat
          if %ERRORLEVEL% NEQ 0 (
            echo === bootstrap.log ===
            type bootstrap.log
            exit /b 1
          )

          rem Build x86 (Win32) - Win7 compatible settings
          b2 toolset=%BJAM_TOOLSET% variant=release link=static threading=multi runtime-link=static cxxflags="/Zc:threadSafeInit- " define=BOOST_USE_WINAPI_VERSION=0x0601 --with-date_time --with-filesystem --with-locale --with-regex --with-system --with-thread --with-serialization stage -q -d0
          if %ERRORLEVEL% NEQ 0 exit /b 1

          rem Build x64
          b2 toolset=%BJAM_TOOLSET% variant=release link=static threading=multi runtime-link=static cxxflags="/Zc:threadSafeInit- " define=BOOST_USE_WINAPI_VERSION=0x0601 address-model=64 --stagedir=stage_x64 --with-date_time --with-filesystem --with-locale --with-regex --with-system --with-thread --with-serialization stage -q -d0
          if %ERRORLEVEL% NEQ 0 exit /b 1

      # ==================== 4. Verify librime files ====================
      # librime 1.11.2 headers, libs, dlls are committed in the repo
      - name: Verify librime files
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Verifying local librime $env:LIBRIME_VERSION files..."

          $requiredFiles = @(
            "include\rime_api.h",
            "include\rime_levers_api.h",
            "lib\rime.lib",
            "lib\rime.dll",
            "lib\x64\rime.lib",
            "lib\x64\rime.dll",
            "output\rime.dll"
          )

          $allFound = $true
          foreach ($f in $requiredFiles) {
            if (Test-Path $f) {
              $size = (Get-Item $f).Length
              $sizeStr = "{0:N0}" -f $size
              Write-Host "  OK  $f ($sizeStr bytes)"
            } else {
              Write-Host "  FAIL $f"
              $allFound = $false
            }
          }

          if (-not $allFound) {
            Write-Error "librime files missing. Please ensure lib/ and include/ are committed to the repo."
            exit 1
          }

          Write-Host ""
          Write-Host "librime $env:LIBRIME_VERSION files verified OK"

      # ==================== 5. Configure Build Environment ====================
      - name: Configure build environment
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          # Create env.bat
          @"
          rem GitHub Actions build environment
          set BOOST_ROOT=$env:BOOST_ROOT
          set PLATFORM_TOOLSET=$env:PLATFORM_TOOLSET
          set BJAM_TOOLSET=$env:BJAM_TOOLSET
          "@ | Out-File -FilePath "env.bat" -Encoding ascii

          # Generate weasel.props via render.js
          cscript.exe render.js weasel.props BOOST_ROOT PLATFORM_TOOLSET PYTHON_HOME

          # Create Directory.Build.props for Win7 compatibility
          # v141 toolset defaults to Win10 target; explicitly set _WIN32_WINNT
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>_WIN32_WINNT=0x0601;WINVER=0x0601;%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@ | Out-File -FilePath "Directory.Build.props" -Encoding utf8

          # Copy required files
          Copy-Item "LICENSE.txt" -Destination "output\" -Force
          Copy-Item "README.md" -Destination "output\README.txt" -Force

          # Show build configuration
          Write-Host "========================================"
          Write-Host "Build Configuration:"
          Write-Host "  WEASEL_VERSION   = $env:WEASEL_VERSION"
          Write-Host "  WEASEL_BUILD     = $env:WEASEL_BUILD"
          Write-Host "  BOOST_ROOT       = $env:BOOST_ROOT"
          Write-Host "  PLATFORM_TOOLSET = $env:PLATFORM_TOOLSET"
          Write-Host "  LIBRIME_VERSION  = $env:LIBRIME_VERSION"
          Write-Host "========================================"

      # ==================== 6. Build ====================
      - name: Build Weasel
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          rem Setup MSBuild environment with v142 toolset
          call "%VCVARS_PATH%" x86 -vcvars_ver=%VCVARS_VER%

          rem Build data files (requires bash)
          set plum_dir=plum
          set rime_dir=output/data
          bash plum/rime-install

          rem Backup x86 rime.lib (lib\rime.lib is initially x86)
          copy /Y lib\rime.lib lib\rime_x86.lib

          rem === Build x64 ===
          copy /Y lib\x64\rime.lib lib\rime.lib
          copy /Y lib\x64\rime.dll output\rime.dll

          msbuild.exe weasel.sln /t:Build /p:Configuration=Release /p:Platform="x64" /fl2 /m
          if %ERRORLEVEL% NEQ 0 (
            echo x64 build failed, see msbuild2.log
            type msbuild2.log
            exit /b 1
          )

          rem === Build Win32 (x86) ===
          copy /Y lib\rime_x86.lib lib\rime.lib
          copy /Y lib\rime.dll output\rime.dll

          msbuild.exe weasel.sln /t:Build /p:Configuration=Release /p:Platform="Win32" /fl1 /m
          if %ERRORLEVEL% NEQ 0 (
            echo Win32 build failed, see msbuild1.log
            type msbuild1.log
            exit /b 1
          )

          rem === Build Hant x64 ===
          copy /Y lib\x64\rime.lib lib\rime.lib
          copy /Y lib\x64\rime.dll output\rime.dll

          msbuild.exe weasel.sln /t:Build /p:Configuration=ReleaseHant /p:Platform="x64" /fl4 /m
          if %ERRORLEVEL% NEQ 0 exit /b 1

          rem === Build Hant Win32 ===
          copy /Y lib\rime_x86.lib lib\rime.lib
          copy /Y lib\rime.dll output\rime.dll

          msbuild.exe weasel.sln /t:Build /p:Configuration=ReleaseHant /p:Platform="Win32" /fl3 /m
          if %ERRORLEVEL% NEQ 0 exit /b 1

          rem Cleanup temp backup
          del lib\rime_x86.lib

      # ==================== 7. Generate Installer ====================
      - name: Generate installer
        if: ${{ github.event.inputs.build_installer == 'true' }}
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe"
          if (-not (Test-Path $nsis)) {
            $nsis = "${env:ProgramFiles}\NSIS\Bin\makensis.exe"
          }

          if (Test-Path $nsis) {
            Write-Host "Generating installer..."
            New-Item -ItemType Directory -Path "output\archives" -Force | Out-Null
            & $nsis /DWEASEL_VERSION=$env:WEASEL_VERSION /DWEASEL_BUILD=$env:WEASEL_BUILD output\install.nsi
            if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS installer generation failed"
              exit 1
            }
            Write-Host "Installer generated to output\archives\"
          } else {
            Write-Warning "NSIS not found, skipping installer generation."
            Write-Warning "Build artifacts are in output\ directory."
          }

      # ==================== 8. Upload Artifacts ====================
      - name: Upload installer
        if: ${{ github.event.inputs.build_installer == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weasel-${{ env.WEASEL_VERSION }}.${{ env.WEASEL_BUILD }}-installer
          path: output\archives\*.exe
          retention-days: 30

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: weasel-${{ env.WEASEL_VERSION }}.${{ env.WEASEL_BUILD }}-output
          path: |
            output\*.exe
            output\*.dll
            output\*.ime
            output\data\
          retention-days: 30

      # ==================== 9. Build Report ====================
      - name: Build report
        if: always()
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Build Complete!"
          Write-Host "========================================"
          Write-Host "Version: $env:WEASEL_VERSION (build $env:WEASEL_BUILD)"
          Write-Host ""

          if (Test-Path "output\archives\*.exe") {
            $installer = Get-ChildItem "output\archives\*.exe" | Select-Object -First 1
            Write-Host "Installer: $($installer.Name)"
          } else {
            Write-Host "Installer: not generated (check NSIS)"
          }

          Write-Host ""
          Write-Host "Artifacts:"
          Get-ChildItem "output\" -File | ForEach-Object { $s = "{0:N0}" -f $_.Length; Write-Host "  $($_.Name) ($s bytes)" }
          Write-Host "========================================"